name: openzo_frontend
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  carousel_slider: ^4.2.1

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_otp_text_field: ^1.1.1
  geolocator: ^11.0.0
  google_fonts: 6.1.0
  go_router:
  provider: ^6.1.2
  rxdart: ^0.27.7
  shared_preferences: ^2.2.2
  accordion: ^2.6.0
  url_launcher: ^6.2.4
  firebase_core:
  webview_flutter: ^4.7.0
  booking_calendar: ^1.1.10
  booking_and_publish_slots: ^0.0.18
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  firebase_messaging: ^14.8.1
  image_fade: ^0.6.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/General Stores/
    - assets/images/Electronic Stores/
    - assets/images/top/
    - assets/images/Stationary Stores/
    - assets/images/Fashion Stores/
    - assets/images/Footwear Stores/
    - lib/icons/
