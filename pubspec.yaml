name: openzo_frontend
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.2+18

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  carousel_slider: ^5.0.0
  win32: ^5.7.0

  flutter:
    sdk: flutter
  flutter_otp_text_field: ^1.1.1
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  go_router:
  provider: ^6.1.2
  rxdart: ^0.28.0
  shared_preferences: ^2.2.2
  accordion: ^2.6.0
  url_launcher: ^6.2.4
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  webview_flutter: ^4.7.0
  booking_calendar: ^1.1.10
  shimmer: ^3.0.0
  booking_and_publish_slots: ^0.0.18
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  firebase_messaging: ^15.1.3
  image_fade: ^0.6.2
  firebase_auth: ^5.3.1
  http: ^1.2.1
  awesome_notifications_core: ^0.10.0 # <~ always ensure to use the latest version
  awesome_notifications: any # <~ this version is managed by awesome_notifications_core package
  flutter_rating_bar: ^4.0.0
  intl: ^0.18.1
  dotted_border: ^2.1.0
  flutter_screenutil:
  share_plus: ^10.1.0
  path_provider: ^2.1.3
  lottie: ^3.1.2
  circular_countdown_timer: ^0.2.3
  internet_connection_checker_plus: ^2.5.2
  phonepe_payment_sdk: ^2.0.3
  crypto: ^3.0.3



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
