name: openzo_frontend
description: A new Flutter project.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+8

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  carousel_slider: ^4.2.1

  flutter:
    sdk: flutter
  flutter_otp_text_field: ^1.1.1
  geolocator: ^11.0.0
  google_fonts: 6.1.0
  go_router:
  provider: ^6.1.2
  rxdart: ^0.27.7
  shared_preferences: ^2.2.2
  accordion: ^2.6.0
  url_launcher: ^6.2.4
  firebase_core: ^2.32.0
  firebase_analytics: ^10.10.7
  webview_flutter: ^4.7.0
  booking_calendar: ^1.1.10
  shimmer: ^3.0.0
  booking_and_publish_slots: ^0.0.18
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  firebase_messaging: ^14.8.1
  image_fade: ^0.6.2
  firebase_auth: ^4.20.0
  http: ^1.2.1
  awesome_notifications_core: ^0.9.0 # <~ always ensure to use the latest version
  awesome_notifications: any # <~ this version is managed by awesome_notifications_core package
  flutter_rating_bar: ^4.0.0
  intl: ^0.18.1
  dotted_border: ^2.1.0
  flutter_screenutil: 
  share_plus: 8.0.3
  path_provider: ^2.1.3

   

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/General Stores/
    - assets/images/Electronic Stores/
    - assets/images/top/
    - assets/images/Stationary Stores/
    - assets/images/Fashion Stores/
    - assets/images/Footwear Stores/
    - assets/images/home page icons/
    - assets/icons/
    - assets/images/Categories page/
    - assets/images/Categories page/Coachings/
    - assets/images/Categories page/Agencies/
    - assets/images/Categories page/Food/
    - assets/images/Categories page/Home Services/
    - assets/images/Categories page/Institutions/
    - assets/images/Categories page/Movies & Events/
    - assets/images/Categories page/Rental stores/
    - assets/images/Categories page/Services/
    - assets/images/Categories page/Showrooms/
    - assets/images/Categories page/Stores/
    - assets/images/Categories page/Explore/
    
    
